identity:
  schemas:
    - id: default
      url: file:///etc/kratos/identity-schemas/service/json/person.schema.json
  default_schema_id: "default"

oauth2_provider:
  override_return_to: true
preview:
  default_read_consistency_level: strong
security:
  account_enumeration:
    mitigate: true
selfservice:
  allowed_return_urls:
    - https://nostalgic-carver-mcyw2yijqr.projects.oryapis.com
    - /ui/logout
    - /ui/consent
    - /ui/welcome
    - /ui/sessions
    - http://localhost:5173/error
    - http://localhost:5173/login
    - http://localhost:5173/recovery
    - http://localhost:5173/register
    - http://localhost:5173/settings
    - http://localhost:5173/verification
  default_browser_return_url: http://localhost:5173
  flows:
    error:
      ui_url: http://localhost:5173/error

    login:
      ui_url: http://localhost:5173/login
      lifespan: 1h
      style: unified
      before:
        hooks: []
      after:
        password:
          hooks: []
        oidc:
          hooks: []
        totp:
          hooks: []
        webauthn:
          hooks: []
        lookup_secret:
          hooks: []

    logout:
      after: {}

    recovery:
      enabled: true
      lifespan: 1h
      notify_unknown_recipients: false
      ui_url: http://localhost:5173/recovery
      use: code
      before:
        hooks: []
      after:
        hooks: []

    registration:
      enabled: true
      lifespan: 1h
      enable_legacy_one_step: true
      login_hints: true
      ui_url: http://localhost:5173/register
      before:
        hooks: []
      after:
        password:
          hooks:
            - hook: show_verification_ui
        oidc:
          hooks:
            - hook: session
        passkey:
          hooks:
            - hook: session
        webauthn:
          hooks:
            - hook: session
        code:
          hooks:
            - hook: session

    settings:
      lifespan: 1h
      privileged_session_max_age: 15m0s
      required_aal: aal1
      ui_url: http://localhost:5173/settings
      before:
        hooks: []
      after:
        password:
          hooks: []
        profile:
          hooks: []
        totp:
          hooks: []
        webauthn:
          hooks: []
        lookup_secret:
          hooks: []
        passkey:
          hooks: []
        oidc:
          hooks: []

    verification:
      enabled: true
      lifespan: 1h
      notify_unknown_recipients: true
      ui_url: http://localhost:5173/verification
      use: code
      before:
        hooks: []
      after:
        hooks: []
  methods:
    b2b:
      config:
        organizations: []
    code:
      config:
        missing_credential_fallback_enabled: true
      mfa_enabled: true
    link:
      config:
        base_url: ""
    lookup_secret: {}
    oidc:
      config:
        providers: []
      enabled: false
    passkey:
      config:
        rp:
          display_name: temp
          id: nostalgic-carver-mcyw2yijqr.projects.oryapis.com
          origins:
          - https://nostalgic-carver-mcyw2yijqr.projects.oryapis.com
    password:
      config: {}
    profile: {}
    totp:
      config:
        issuer: temp
    webauthn:
      config:
        passwordless: false
        rp:
          display_name: temp
          id: nostalgic-carver-mcyw2yijqr.projects.oryapis.com
          origins:
          - https://nostalgic-carver-mcyw2yijqr.projects.oryapis.com

